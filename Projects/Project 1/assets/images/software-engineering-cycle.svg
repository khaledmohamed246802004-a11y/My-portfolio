<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Software process activities</title>
  <desc id="desc">Four connected stages: specification, development, validation, and evolution, with feedback from evolution to specification.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="18" y="65" width="185" height="92" rx="12" fill="#e6fffb" stroke="#0f766e" stroke-width="2"/>
  <rect x="250" y="65" width="185" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="482" y="65" width="185" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="714" y="65" width="168" height="92" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <g fill="#1e293b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="110" y="105">Specification</text><text x="342" y="105">Development</text>
    <text x="574" y="105">Validation</text><text x="798" y="105">Evolution</text>
  </g>
  <g stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M204 111 H243"/><path d="M436 111 H475"/><path d="M668 111 H707"/>
    <path d="M798 165 V220 H110 V165"/>
  </g>
  <text x="454" y="249" fill="#475569" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Feedback and changing needs can restart the process</text>
</svg>
